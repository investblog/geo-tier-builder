name: Submit to stores

# Two ways in:
#   - push a v* tag  -> Chrome is submitted to the Web Store AUTOMATICALLY
#     (real submit, in parallel with release.yml which makes the GH release).
#   - manual run (Actions -> Submit to stores -> Run workflow) -> pick a tag
#     and dry_run (default true: validates credentials, publishes nothing).
#     Use the manual path for dry-run checks and, later, other stores.
#
# Credentials live in GitHub repo secrets (Settings -> Secrets and variables
# -> Actions), never in the repo:
#   CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
# Requires the Chrome Web Store API enabled in the GCP project of the OAuth
# client (otherwise a valid token still 403s with SERVICE_DISABLED).
# Firefox/Edge will be added here once those credentials exist.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v0.3.0)'
        required: true
      dry_run:
        description: 'Dry run (validate credentials only, publish nothing)'
        type: boolean
        default: true

# One submission per ref at a time; never cancel an in-flight upload.
concurrency:
  group: submit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit-chrome:
    runs-on: ubuntu-latest
    env:
      # Tag push -> real submit. Manual run -> honor the dry_run checkbox.
      REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT types
        run: npx wxt prepare

      - name: Build Chrome zip
        run: npm run zip

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          # Clean checkout has exactly one chrome zip; assert it to avoid
          # ever submitting a stale version.
          mapfile -t ZIPS < <(ls dist/*-chrome.zip)
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "Expected exactly one dist/*-chrome.zip, found ${#ZIPS[@]}: ${ZIPS[*]}" >&2
            exit 1
          fi
          CHROME_ZIP="${ZIPS[0]}"
          echo "Ref: $REF  |  zip: $CHROME_ZIP  |  dry_run: $DRY"
          if [ "$DRY" = "true" ]; then
            npx wxt submit --dry-run --chrome-zip "$CHROME_ZIP"
          else
            npx wxt submit --chrome-zip "$CHROME_ZIP"
          fi
