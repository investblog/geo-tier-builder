name: Submit to stores

# Thin caller of the shared reusable workflow (also lives in this repo).
# Chrome + Edge auto-submit on a v* tag; Firefox is manual-only (the
# reusable workflow centrally gates Firefox to workflow_dispatch since
# AMO burns version numbers). Manual run lets you pick stores + dry_run.
# Secrets (CHROME_*/FIREFOX_*/EDGE_*) are this repo's GitHub secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v0.3.0)'
        required: true
      stores:
        description: 'Which store(s) to submit'
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - all
        default: chrome
      dry_run:
        description: 'Dry run (validate credentials only, publish nothing)'
        type: boolean
        default: true

concurrency:
  group: submit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    uses: investblog/geo-tier-builder/.github/workflows/store-submit.yml@main
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      chrome: ${{ github.event_name == 'push' || inputs.stores == 'chrome' || inputs.stores == 'all' }}
      firefox: ${{ inputs.stores == 'firefox' || inputs.stores == 'all' }}
      edge: ${{ github.event_name == 'push' || inputs.stores == 'edge' || inputs.stores == 'all' }}
