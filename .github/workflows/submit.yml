name: Submit to stores

# Manual gate, separate from release.yml. Flow:
#   1. push v* tag  -> release.yml builds + creates the GitHub release
#   2. verify the release
#   3. run THIS workflow (Actions tab -> Submit to stores -> Run workflow)
#      Defaults to --dry-run: only validates credentials, publishes nothing.
#      Uncheck "dry_run" to actually submit to the Chrome Web Store.
#
# Credentials live in GitHub repo secrets (Settings -> Secrets and variables
# -> Actions), never in the repo:
#   CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
# Firefox/Edge will be added here once Chrome is proven.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v0.3.0) — checked out so the upload matches the release'
        required: true
      dry_run:
        description: 'Dry run (validate credentials only, publish nothing)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit-chrome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT types
        run: npx wxt prepare

      - name: Build Chrome zip
        run: npm run zip

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          CHROME_ZIP="$(ls dist/*-chrome.zip)"
          echo "Chrome zip: $CHROME_ZIP"
          echo "Tag: ${{ inputs.tag }}  |  dry_run: ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx wxt submit --dry-run --chrome-zip "$CHROME_ZIP"
          else
            npx wxt submit --chrome-zip "$CHROME_ZIP"
          fi
